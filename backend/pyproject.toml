[project]
name = "docweave-backend"
version = "0.1.0"
description = "Backend services for DocWeave."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "anyio>=4,<5",
    "httpx>=0.28,<1",
    "jsonschema[format]>=4.23,<5",
    "openapi-spec-validator>=0.7.2,<0.9",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
